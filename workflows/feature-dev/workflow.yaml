      Feature: {{task}}

      All stories have been implemented, verified, and tested.

      Create a pull request with comprehensive documentation.
    expects: "PR_COMPLETE"
    depends_on: [story_1_test, story_2_test, story_3_test, story_4_test, story_5_test, story_6_test, story_7_test]
